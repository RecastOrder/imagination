# 云服务器上运行：cd deploy && docker compose up -d --build
# 两个服务：app（平台本身）+ caddy（自动申请 HTTPS 证书、转发到 app）
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data
    depends_on:
      - app
